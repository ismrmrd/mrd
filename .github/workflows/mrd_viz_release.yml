name: MRD Viz Release

on:
  push:
    tags:
      - "mrd-viz-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package VSIX
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mrd-viz/extension/mrd-viz/package-lock.json

      - name: Install dependencies
        working-directory: mrd-viz/extension/mrd-viz
        run: npm ci

      - name: Package VSIX
        working-directory: mrd-viz/extension/mrd-viz
        run: npx --yes @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrd-viz-vsix
          path: mrd-viz/extension/mrd-viz/*.vsix

      # On a version tag, publish a GitHub Release with the VSIX attached so
      # researchers can install it via: code --install-extension mrd-viz-*.vsix
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mrd-viz/extension/mrd-viz/*.vsix
          generate_release_notes: true
